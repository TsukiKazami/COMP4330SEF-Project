[project]
name = "comp4330sef-project"
version = "0.1.0"
description = "A Systematic Evaluation of YOLOv8: Model Scaling, Parameter Sensitivity, and Failure Modes in Hong Kong Street Scenes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tidecv>=1.0.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.207",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comp4330sef"]

[project.scripts]
comp4330 = "comp4330sef.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
